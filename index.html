<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0d12">
<title>Selfie Chaos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-screen mirrored selfie. Questions drift from top to bottom in two
   lanes as translucent glass frames; a reveal pauses the stream and shows a result card. */
:root{
  --ink:#0e0d12; --text:#f6f4f1; --dim:rgba(246,244,241,.7); --accent:#ffd27a;
  --glass:rgba(18,16,24,.40); --glass-strong:rgba(18,16,24,.60); --edge:rgba(255,255,255,.22);
  --blur:blur(14px) saturate(1.3);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);
  font-family:var(--font);font-size:15px;font-weight:500;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

#cam,#demoImg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#cam{transform:scaleX(-1)}
#demoBg{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 20%,#3a3350 0%,#1c1926 55%,var(--ink) 100%)}
#shade{position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(14,13,18,.45) 0,transparent 14%,transparent 70%,rgba(14,13,18,.5) 100%)}

/* top bar */
#bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(var(--st) + 10px) 14px 8px;z-index:7}
.brand{font-weight:800;font-size:12px;letter-spacing:.2em;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 11px;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.pill i{width:6px;height:6px;border-radius:50%;background:#ff5a6e;animation:blink 1.6s infinite}
#newBtn{margin-left:auto;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:700}
@keyframes blink{50%{opacity:.25}}

/* faces */
#faces{position:fixed;inset:0;pointer-events:none;z-index:4}
.face{position:absolute;left:0;top:0;will-change:transform}
.ring{position:absolute;inset:0;border:1.5px solid rgba(255,255,255,.4);border-radius:32%;transition:border-color .3s,box-shadow .3s}
.face.lost .ring{opacity:.2}
body[data-state="scan"] .face.in .ring{border-color:var(--accent);box-shadow:0 0 22px rgba(255,210,122,.35);animation:pulse .6s infinite alternate}
body[data-state="reveal"] .face.in .ring{border-color:rgba(255,255,255,.85)}
@keyframes pulse{to{transform:scale(1.04)}}
.emoji{position:absolute;inset:8%;display:grid;place-items:center;border-radius:50%;background:#e9d9b4;
  font-size:min(16vw,80px);line-height:1}

.label{position:absolute;left:0;top:0;max-width:min(46vw,250px);text-align:center;will-change:transform;
  display:flex;flex-direction:column;gap:4px;padding:10px 13px;border-radius:16px;
  background:var(--glass-strong);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  animation:pop .4s cubic-bezier(.2,1.1,.3,1) both}
.label .tag{font-weight:800;font-size:11px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-wrap:balance}
.label.win{border-color:rgba(255,210,122,.7)}
.label.win .tag{color:var(--accent)}
.label .line{font-size:14px;font-weight:600;line-height:1.3;text-wrap:balance}
.label.think .line{font-style:italic;font-weight:500;font-size:15px}
@keyframes pop{from{opacity:0;scale:.85}to{opacity:1;scale:1}}

/* scan sweep */
#scan{position:fixed;left:0;right:0;top:0;height:2px;z-index:5;pointer-events:none;background:var(--accent);
  box-shadow:0 0 26px 8px rgba(255,210,122,.3);animation:sweep .75s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(8vh)}to{transform:translateY(92vh)}}
#chip{position:fixed;top:calc(var(--st) + 52px);left:50%;transform:translateX(-50%);z-index:6;white-space:nowrap;
  font-weight:700;font-size:14px;padding:8px 15px;border-radius:99px;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  background:var(--glass-strong)}

/* question stream */
#stream{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity .3s}
body:not([data-state="play"]) #stream{opacity:0}
.q{position:absolute;left:0;top:0;will-change:transform,opacity;pointer-events:auto;display:flex;align-items:center;gap:9px;
  max-width:min(47vw,270px);padding:11px 14px;border-radius:16px;text-align:left;font-weight:700;font-size:14.5px;line-height:1.2;
  box-shadow:0 6px 22px rgba(0,0,0,.16)}
.q span:first-child{font-size:16px;line-height:1}
.q:active{background:rgba(255,255,255,.26)}
#stream.locked .q,body:not([data-state="play"]) .q{pointer-events:none}
#hint{position:fixed;left:50%;bottom:calc(var(--sb) + 14px);transform:translateX(-50%);z-index:6;display:flex;gap:10px;
  align-items:baseline;white-space:nowrap;border-radius:99px;padding:8px 15px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;pointer-events:none;transition:opacity .3s;max-width:94vw}
#left{font-variant-numeric:tabular-nums;color:var(--dim)}
#left:empty{display:none}
body:not([data-state="play"]) #hint{opacity:0}

/* result card */
#card{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);border-top:1px solid var(--edge);border-radius:22px 22px 0 0;
  padding:16px 20px calc(var(--sb) + 16px);display:flex;flex-direction:column;gap:7px;
  animation:cardUp .4s cubic-bezier(.2,1,.3,1) both}
@keyframes cardUp{from{transform:translateY(100%)}to{transform:none}}
#strip{align-self:flex-start;color:var(--accent);border:1px solid rgba(255,210,122,.55);font-weight:700;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
#qt{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#head{font-weight:800;font-size:clamp(19px,5.2vw,25px);line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
#meter{font-weight:800;font-size:52px;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
#why{font-size:13px;font-style:italic;color:var(--dim);margin:0}
#twist{font-size:15px;font-weight:700;color:var(--accent);margin:2px 0 0;animation:pop .4s cubic-bezier(.2,1.1,.3,1) both;transform-origin:left}
#next{align-self:flex-end;background:var(--text);color:var(--ink);font-weight:800;font-size:14px;border-radius:99px;
  padding:10px 20px;margin-top:4px}

/* start screen */
#start{position:fixed;inset:0;z-index:9;background:var(--ink);display:flex;flex-direction:column;justify-content:center;
  gap:18px;padding:calc(var(--st) + 24px) max(26px,env(safe-area-inset-left,0px)) calc(var(--sb) + 24px)}
#start h1{font-weight:800;font-size:clamp(42px,13vw,76px);line-height:.95;margin:0;letter-spacing:-.04em}
#start h1 em{font-style:normal;color:var(--accent)}
#start p{margin:0;max-width:34ch;font-size:16px;line-height:1.45;color:var(--dim)}
.go{background:var(--text);color:var(--ink);font-weight:800;font-size:17px;border-radius:99px;padding:15px 26px;align-self:flex-start}
.alt{background:none;text-decoration:underline;align-self:flex-start;padding:4px 0;font-size:14px;color:var(--dim)}
#status{min-height:2.8em;font-size:14px;color:#ff8a98}
.fine{font-size:12px!important;opacity:.7}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body data-state="start">
<video id="cam" playsinline muted autoplay></video>
<img id="demoImg" alt="" crossorigin="anonymous" hidden>
<div id="demoBg" hidden></div>
<div id="shade"></div>
<div id="faces"></div>
<div id="scan" hidden></div>
<div id="chip" class="glass" hidden></div>

<div id="bar">
  <span class="brand">SELFIE CHAOS</span>
  <span class="pill glass" id="count"><i></i><span>Live</span></span>
  <button id="newBtn" class="glass" type="button">New session</button>
</div>

<div id="stream" class="locked"></div>
<div id="hint" class="glass"><span id="hintText">Looking for faces…</span><span id="left"></span></div>

<div id="card" hidden>
  <span id="strip" hidden></span>
  <span id="qt"></span>
  <p id="head"></p>
  <div id="meter" hidden></div>
  <p id="why" hidden></p>
  <p id="twist" hidden></p>
  <button id="next" type="button" hidden>Next ➜</button>
</div>

<div id="start">
  <h1>Selfie <em>Chaos</em></h1>
  <p>Grab a friend, get both faces in the frame, and tap a question to discover your ridiculous truth.</p>
  <button class="go" id="goCam" type="button">Start camera</button>
  <button class="alt" id="goDemo" type="button">Try it without a camera</button>
  <div id="status" role="status"></div>
  <p class="fine">Every result is made up. Nothing is recorded and nothing leaves this phone.</p>
</div>

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

 {h:"Adult found. Barely.",w:["ADULT (PROVISIONAL)","Has a favourite ring on the cooker."],o:[["TALL CHILD","Googles how long to boil an egg. Every time."],["TALL CHILD","Thinks a boiler is a kind of dog."],["INTERN AT LIFE","4% battery. No charger. No plan."]],x:"Correction: licence revoked until someone files a tax return."}]},

const NO_EVIDENCE = ["Evidence: none. The scanner just has a feeling.","Method: the scanner closed its eyes and pointed.","Evidence: purely the look on that face."];
const SIG_MIN = {smile:.25, mouth:.12, brows:.2, tilt:6};

/* ---------- State ---------- */
const S = {mode:null, tracks:[], nextId:1, armed:false, since2:0, lost2:0, deck:[], roster:[], cur:null, curBubble:null,
  timers:[], demoN:2, lastDet:0, count:-1, chips:[], lane:0, spawnIn:0, prev:0};
window.selfieChaos = S; // handy for debugging from the console
let W = innerWidth, H = innerHeight;
addEventListener('resize', () => { W = innerWidth; H = innerHeight; });
const body = document.body, cam = $('#cam'), facesEl = $('#faces'), stream = $('#stream'), card = $('#card');
const setState = s => { body.dataset.state = s; };
const later = (fn, ms) => S.timers.push(setTimeout(fn, ms));

/* ---------- Sound ---------- */
let ac;

/* ---------- Face detection ---------- */
let landmarker = null;
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
async function loadDetector() {
  const mp = await import(MP + '/vision_bundle.mjs');
  const fileset = await mp.FilesetResolver.forVisionTasks(MP + '/wasm');
  landmarker = await mp.FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {modelAssetPath: MODEL, delegate: location.search.includes('gpu') ? 'GPU' : 'CPU'},
    runningMode: 'VIDEO', numFaces: 6, outputFaceBlendshapes: true,

}
function detectCam(now) {

  return detectEl(cam, cam.videoWidth, cam.videoHeight, true, now);
}
function detectPhoto(now) {

}
function detectEl(el, vw, vh, mirror, now) {
  if (!landmarker) return null;

  const sc = Math.max(W / vw, H / vh), ox = (W - vw * sc) / 2, oy = (H - vh * sc) / 2;

    let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
    for (const p of lm) { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; }
    const bs = {};
    for (const c of (res.faceBlendshapes && res.faceBlendshapes[i] ? res.faceBlendshapes[i].categories : [])) bs[c.categoryName] = c.score;
    const a = lm[33], b = lm[263];
    let tilt = Math.abs(Math.atan2((b.y - a.y) * vh, (b.x - a.x) * vw) * 180 / Math.PI);
    if (tilt > 90) tilt = 180 - tilt;
    return {
      x: ox + (mirror ? 1 - (x0 + x1) / 2 : (x0 + x1) / 2) * vw * sc, y: oy + (y0 + y1) / 2 * vh * sc,
      w: (x1 - x0) * vw * sc * 1.2, h: (y1 - y0) * vh * sc * 1.2,
      smile: ((bs.mouthSmileLeft || 0) + (bs.mouthSmileRight || 0)) / 2, mouth: bs.jawOpen || 0,
      brows: Math.max(bs.browInnerUp || 0, ((bs.browOuterUpLeft || 0) + (bs.browOuterUpRight || 0)) / 2), tilt,

}
/* Demo: wobbling stand-in faces with made-up signals, so the game can be tried without a camera. */
let demoMood = [], demoMoodAt = -1e9;
function detectDemo(now) {
  const n = S.demoN;
  if (now - demoMoodAt > 3000) { demoMoodAt = now; demoMood = Array.from({length: 6}, () => ({smile: Math.random(), mouth: Math.random() * .5, brows: Math.random() * .6, tilt: Math.random() * 14, wig: .3 + Math.random() * 2, size: .85 + Math.random() * .3})); }
  const base = Math.min(W / (n + 1.3), H * .24, 200);
  return Array.from({length: n}, (_, i) => {
    const m = demoMood[i], t = now / 1000;
    return {x: W * (i + 1) / (n + 1) + Math.sin(t * 1.3 + i * 2) * 7 * m.wig, y: H * .34 + Math.cos(t * 1.1 + i) * 6 * m.wig,
      w: base * m.size, h: base * m.size * 1.15, smile: m.smile, mouth: m.mouth, brows: m.brows, tilt: m.tilt};
  });
}

/* ---------- Tracking: keep a stable id on each face from frame to frame ---------- */
const DEMO_EMOJI = ['😀', '😎', '🤨', '😴', '🥳', '🤓'];
function makeTrack(d, now) {
  const t = {id: S.nextId++, x: d.x, y: d.y, w: d.w, h: d.h, tx: d.x, ty: d.y, tw: d.w, th: d.h, lastSeen: now, acc: null, frozen: false};
  t.el = document.createElement('div'); t.el.className = 'face';
  t.el.innerHTML = '<div class="ring"></div>';
  if (S.mode === 'demo') { const e = document.createElement('div'); e.className = 'emoji'; e.textContent = DEMO_EMOJI[(t.id - 1) % DEMO_EMOJI.length]; t.el.prepend(e); }
  t.lab = document.createElement('div'); t.lab.className = 'label'; t.lab.hidden = true;
  facesEl.append(t.el, t.lab);

}
function updateTracks(dets, now) {
  const pairs = [];

    const dist = Math.hypot(t.tx - d.x, t.ty - d.y);
    if (dist < .8 * Math.max(t.tw, d.w)) pairs.push({ti, di, dist});
  }));
  pairs.sort((a, b) => a.dist - b.dist);

  for (const p of pairs) {
    if (usedT.has(p.ti) || usedD.has(p.di)) continue;
    usedT.add(p.ti); usedD.add(p.di);
    const t = S.tracks[p.ti], d = dets[p.di];
    if (t.acc) { const a = t.acc; a.n++; a.smile += d.smile; a.mouth += d.mouth; a.brows += d.brows; a.tilt += d.tilt; a.move += p.dist / Math.max(d.w, 1); a.size += d.w; }
    t.tx = d.x; t.ty = d.y; t.tw = d.w; t.th = d.h; t.lastSeen = now;
  }

}
function prune(now) {
  S.tracks = S.tracks.filter(t => {
    if (t.frozen || now - t.lastSeen < 900) return true;
    t.el.remove(); t.lab.remove(); return false;
  });
}
const present = now => S.tracks.filter(t => now - t.lastSeen < 450);

/* ---------- Per-frame ---------- */
function frame(now) {

    const dets = S.mode === 'cam' ? detectCam(now) : S.mode === 'photo' ? detectPhoto(now) : detectDemo(now);
    if (dets) { S.lastDet = now; updateTracks(dets, now); }

  const n = present(now).length;
  if (n >= 2) { S.lost2 = 0; if (!S.since2) S.since2 = now; if (now - S.since2 > 500) S.armed = true; }
  else { S.since2 = 0; if (!S.lost2) S.lost2 = now; if (now - S.lost2 > 1200) S.armed = false; }

    S.count = n;
    $('#count span').textContent = n ? `Live · ${n} player${n > 1 ? 's' : ''}` : 'Live';
    stream.classList.toggle('locked', !S.armed);
    refreshHint();
  }
  const dt = Math.min(50, now - (S.prev || now)); S.prev = now;
  if (body.dataset.state === 'play') flow(dt);
  const cardTop = card.hidden ? H : card.getBoundingClientRect().top;
  for (const t of S.tracks) {
    t.x += (t.tx - t.x) * .35; t.y += (t.ty - t.y) * .35; t.w += (t.tw - t.w) * .25; t.h += (t.th - t.h) * .25;
    t.el.style.width = t.w + 'px'; t.el.style.height = t.h + 'px';
    t.el.style.transform = `translate(${t.x - t.w / 2}px,${t.y - t.h / 2}px)`;
    t.el.classList.toggle('lost', now - t.lastSeen > 450);

/* Labels sit under each face (thoughts go above). With four or more players they

function layoutLabels(cardTop) {
  const two = S.roster.length >= 4, rows = [[], []];
  S.roster.forEach((t, i) => {
    const up = t.lab.classList.contains('think') || (two && i % 2 === 1);
    rows[up ? 1 : 0].push({t, up, lw: t.lab.offsetWidth, lh: t.lab.offsetHeight, lx: 0});
  });
  for (const row of rows) {
    row.sort((a, b) => a.t.x - b.t.x);
    row.forEach((r, i) => { r.lx = Math.max(i ? row[i - 1].lx + row[i - 1].lw + 6 : 8, r.t.x - r.lw / 2); });
    for (let i = row.length - 1; i >= 0; i--) { const r = row[i]; r.lx = Math.min(r.lx, (i < row.length - 1 ? row[i + 1].lx - 6 : W - 8) - r.lw); }
    for (const r of row) {
      const t = r.t, below = t.y + t.h / 2 + 10, above = t.y - t.h / 2 - r.lh - 14;
      let ly = (r.up || below + r.lh > cardTop - 8) ? above : below;

/* ---------- Question stream ----------
   Questions drift from the top to the bottom in two lanes. One that reaches the
   bottom untouched goes to the back of the queue and comes round again; one that
   is tapped is gone for the session. */
const SPEED = 58, GAP = 1500, TOP = 52;
function spawn(y) {
  const q = S.deck.shift(); if (!q) return;
  const el = document.createElement('button');
  el.type = 'button'; el.className = 'q glass';
  const e = document.createElement('span'); e.textContent = q.e;
  const t = document.createElement('span'); t.textContent = q.t;
  el.append(e, t); stream.append(el);
  S.lane = 1 - S.lane;
  const c = {q, el, lane: S.lane, w: el.offsetWidth, h: el.offsetHeight, jit: Math.random() * 16, y: 0};
  c.y = y == null ? TOP - c.h : y;
  el.addEventListener('click', () => choose(q, c));

}
function flow(dt) {
  S.spawnIn -= dt;

  const bottom = H - 64, dim = S.armed ? 1 : .45;
  S.chips = S.chips.filter(c => {
    c.y += SPEED * dt / 1000;

    const x = c.lane ? W - c.w - 10 - c.jit : 10 + c.jit;
    const a = Math.max(0, Math.min(1, (c.y - (TOP - c.h)) / 44, (bottom - c.y) / 44));

}
function refreshHint() {
  const left = S.deck.length + S.chips.length, n = S.count;
  $('#left').textContent = left ? left + ' left' : '';
  $('#hintText').textContent = !left ? 'That was every question · tap New session'

}
function newSession() {
  if (body.dataset.state !== 'play') return;
  S.chips.forEach(c => c.el.remove()); S.chips = [];
  S.deck = shuffle(Q); S.spawnIn = GAP;
  const step = SPEED * GAP / 1000;
  for (let y = H - 64 - 110; y > TOP; y -= step) spawn(y); // start with the screen already full
  refreshHint();
}

/* ---------- Reveal ---------- */
function choose(q, bubble) {
  const now = S.frameNow || performance.now(); // judge "who is here" as of the last drawn frame
  if (body.dataset.state !== 'play' || !S.armed) return;
  const roster = present(now).sort((a, b) => a.x - b.x).slice(0, 6);
  if (roster.length < 2) return;
  S.roster = roster; S.cur = q;
  bubble.el.remove(); S.chips = S.chips.filter(c => c !== bubble); // used: gone for this session

  const chip = $('#chip'); chip.textContent = `${q.e} ${q.t}`; chip.hidden = false;

function reveal() {

  const fits = q.v.filter(v => !v.n || (n >= v.n[0] && n <= v.n[1]));
  const v = rnd(fits.length ? fits : q.v);
  const pool = shuffle(v.o);
  const order = q.all ? shuffle(roster) : ranked.map(r => r.t);
  const perRow = (n >= 4 && q.style !== 'think') ? Math.ceil(n / 2) : n;
  const maxW = Math.min(250, (W - 16) / perRow - 6) + 'px';
  order.forEach((t, i) => {
    t.lab.style.maxWidth = maxW;
    const win = !q.all && i === 0;
    const [tag, line] = win ? v.w : pool[(q.all ? i : i - 1) % pool.length];
    t.lab.className = 'label' + (win ? ' win' : '') + (q.style === 'think' ? ' think' : '');

  $('#qt').textContent = `${q.e} ${q.t}`;
  $('#head').textContent = v.h.replace('{n}', n).replace('{m}', n - 1);
  const meter = $('#meter'); meter.hidden = !v.pct;

  card.hidden = false; setState('reveal');
  blip(784, .22, 'triangle', .09);
  later(() => { $('#twist').textContent = v.x; $('#twist').hidden = false; $('#next').hidden = false; blip(392, .25, 'triangle', .07); }, 2600);
  later(endReveal, 12000);
}
function endReveal() {

  S.timers.forEach(clearTimeout); S.timers = [];
  S.roster.forEach(t => { t.frozen = false; t.acc = null; t.lab.hidden = true; t.el.classList.remove('in'); });
  S.roster = []; card.hidden = true;
  setState('play'); refreshHint();
}
$('#next').addEventListener('click', endReveal);
$('#newBtn').addEventListener('click', newSession);
$('#count').addEventListener('click', () => {
  if (body.dataset.state !== 'play') return;
  if (S.mode === 'demo') S.demoN = S.demoN % 5 + 1;
  if (S.mode === 'photo') { S.photoI = (S.photoI + 1) % PHOTOS.length; $('#demoImg').src = PHOTOS[S.photoI]; }
});

/* ---------- Start ---------- */
const status = m => { $('#status').textContent = m; };
function begin(mode) {
  S.mode = mode; $('#start').hidden = true; $('#demoBg').hidden = mode !== 'demo'; $('#demoImg').hidden = mode !== 'photo';
  setState('play'); newSession();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}

}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status('The camera only works when this page is opened from an https:// address.'); return; }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'user', width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
    cam.srcObject = stream; await cam.play();

  try { await loadDetector(); }
  catch (e) {
    stream.getTracks().forEach(t => t.stop());
    status('The face scanner could not load. Check the internet connection and try again.');

}
$('#goCam').addEventListener('click', () => { blip(440, .05); startCamera(); });
/* Demo without a camera: a stock photo of friends, scanned by the real face scanner.

async function startDemo() {
